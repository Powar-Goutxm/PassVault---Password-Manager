services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: passvault_user
      DB_PASS: passvault_secret
      DB_NAME: passvault
      APP_SECRET_KEY: "passvault_secure_production_key!"
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: passvault
      MYSQL_USER: passvault_user
      MYSQL_PASSWORD: passvault_secret
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
